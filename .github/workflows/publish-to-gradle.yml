name: Publish to Gradle Plugin Portal

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build & verify only, no real publish)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry run (build & verify only, no real publish)'
        type: boolean
        default: false

jobs:
  publish:

    runs-on: ubuntu-latest

    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build & Test
        run: ./gradlew build --warning-mode all

      - name: Publish Plugin
        if: inputs.dry_run != true
        run: ./gradlew publishPlugins

      - name: Publish to Maven Local (Dry Run)
        if: inputs.dry_run == true
        run: ./gradlew :bpmn-to-code-gradle:publishToMavenLocal
