name: Publish Snapshot (Maven Central + Docker Hub)

on:
  # Snapshots are published on demand only - not on every push to main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Snapshot version to publish (must end with -SNAPSHOT, e.g. 5.1.0-SNAPSHOT)'
        required: true
        type: string

# Snapshots are mutable - cancel a superseded run so the latest dispatch wins.
concurrency:
  group: publish-snapshot
  cancel-in-progress: true

jobs:
  publish:

    runs-on: ubuntu-latest

    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
      digest: ${{ steps.digest.outputs.digest }}

    env:
      # Same Central Portal token used by the release publish - the snapshot repo shares auth.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MIRAGON_SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MIRAGON_SONATYPE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Validate snapshot version
        id: version
        run: |
          version="${{ inputs.version }}"
          echo "$version" | grep -qE -- '-SNAPSHOT$' || { echo "::error::version must end with -SNAPSHOT"; exit 1; }
          echo "snapshot=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing snapshot version ${version}"

      - name: Build & Test
        run: ./gradlew build --warning-mode all

      # Central Snapshots has no close/release step, so snapshots use `publishToMavenCentral`
      # (upload only) - vanniktech auto-routes -SNAPSHOT versions to the snapshots repo.
      # The three io.miragon library modules publish before the Gradle plugin, whose POM
      # references bpmn-to-code-runtime.
      - name: Publish snapshot to Maven Central Snapshots
        run: >-
          ./gradlew --no-configuration-cache
          -PprojectVersion=${{ steps.version.outputs.snapshot }}
          :bpmn-to-code-runtime:publishToMavenCentral
          :bpmn-to-code-maven:publishToMavenCentral
          :bpmn-to-code-testing:publishToMavenCentral
          :bpmn-to-code-gradle:publishAllPublicationsToCentralSnapshotsRepository

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          username: ${{ secrets.DOCKER_MIRAGON_USERNAME }}
          password: ${{ secrets.DOCKER_MIRAGON_PASSWORD }}

      # Snapshot images are tagged with the -SNAPSHOT version only. Unlike the release
      # workflow, we never push `latest` and never trigger an ops rollout.
      - name: Build Docker snapshot image
        run: >-
          ./gradlew :bpmn-to-code-web:dockerBuild
          -PprojectVersion=${{ steps.version.outputs.snapshot }}

      - name: Push Docker snapshot image
        run: >-
          ./gradlew :bpmn-to-code-web:dockerPush
          -PprojectVersion=${{ steps.version.outputs.snapshot }}

      # Read the immutable manifest digest back from the registry so ops can pin to it.
      # A reused -SNAPSHOT tag yields a fresh digest per build, guaranteeing a real ops
      # change and a deterministic rollout.
      - name: Resolve pushed digest
        id: digest
        run: |
          set -euo pipefail
          ref="miragon/bpmn-to-code-web:${{ steps.version.outputs.snapshot }}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${ref} -> ${digest}"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout

  # After the snapshot image is on Docker Hub, bump the dedicated snapshot deployment
  # in Miragon/ops. update-ops routes -SNAPSHOT versions to bpmn-to-code-web-snapshot.
  update-ops:
    name: Bump ops snapshot deployment
    needs: publish
    uses: ./.github/workflows/update-ops-deployment.yml
    secrets: inherit
    with:
      version: ${{ needs.publish.outputs.snapshot }}
      digest: ${{ needs.publish.outputs.digest }}
