name: Backend Build

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check for backend changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'bpmn-to-code-core/' \
            'bpmn-to-code-runtime/' \
            'bpmn-to-code-gradle/' \
            'bpmn-to-code-maven/' \
            'bpmn-to-code-testing/' \
            'bpmn-to-code-web/' \
            'bpmn-to-code-architecture-tests/' \
            'build.gradle.kts' \
            'settings.gradle.kts' \
            'gradle/libs.versions.toml' \
            '.github/workflows/build-backend.yml')
          if [ -n "$CHANGED" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Gate (ktlint + detekt)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # --continue reports all findings
      - name: Run quality gate (ktlint + detekt)
        run: ./gradlew lintKotlin detektMain detektTest --continue

  build:
    name: Build with Gradle
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Makes CSharpCompilationTest a PR gate (it skips without an SDK)
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0'

      # Linting runs in the quality job
      - name: Run Gradle Build
        run: ./gradlew build --warning-mode all -x lintKotlin -x detekt -x detektMain -x detektTest

      # ≥ 75% per class
      - name: Check Coverage
        run: ./gradlew :bpmn-to-code-core:jacocoTestCoverageVerification :bpmn-to-code-web:jacocoTestCoverageVerification :bpmn-to-code-testing:jacocoTestCoverageVerification :bpmn-to-code-runtime:jacocoTestCoverageVerification

      - name: Post Coverage Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COVERAGE_TABLE=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os
          modules = [
              "bpmn-to-code-core",
              "bpmn-to-code-gradle",
              "bpmn-to-code-maven",
              "bpmn-to-code-web",
              "bpmn-to-code-testing",
              "bpmn-to-code-runtime",
          ]
          rows = []
          for m in modules:
              path = f"{m}/build/reports/jacoco/test/jacocoTestReport.xml"
              if not os.path.exists(path):
                  rows.append(f"| {m} | n/a |")
                  continue
              root = ET.parse(path).getroot()
              line = next((c for c in root.findall("counter") if c.get("type") == "LINE"), None)
              if line is None:
                  rows.append(f"| {m} | n/a |")
              else:
                  covered = int(line.get("covered", 0))
                  missed = int(line.get("missed", 0))
                  total = covered + missed
                  pct = round(covered * 100 / total, 1) if total > 0 else 0.0
                  rows.append(f"| {m} | {pct}% ({covered}/{total} lines) |")
          print("| Module | Line Coverage |\n|--------|---------------|\n" + "\n".join(rows))
          EOF
          )
          MARKER="<!-- bpmn-to-code-coverage -->"
          BODY="${MARKER}
          **Test Coverage**

          ${COVERAGE_TABLE}"
          # Delete any existing coverage comment before posting a fresh one
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | contains("<!-- bpmn-to-code-coverage -->")) | .id' | \
            xargs -I{} gh api --method DELETE "repos/${{ github.repository }}/issues/comments/{}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
