name: Backend Build

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check for backend changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'bpmn-to-code-core/' \
            'bpmn-to-code-runtime/' \
            'bpmn-to-code-gradle/' \
            'bpmn-to-code-maven/' \
            'bpmn-to-code-testing/' \
            'bpmn-to-code-web/' \
            'bpmn-to-code-cli/' \
            'bpmn-to-code-architecture-tests/' \
            'packages/' \
            'build.gradle.kts' \
            'settings.gradle.kts' \
            'gradle/libs.versions.toml' \
            'tools/package.json' \
            'tools/package-lock.json' \
            '.github/workflows/build-backend.yml')
          if [ -n "$CHANGED" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Gate (ktlint + detekt)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # --continue reports all findings
      - name: Run quality gate (ktlint + detekt)
        run: ./gradlew lintKotlin detektMain detektTest --continue

  build:
    name: Build with Gradle
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Makes CSharpCompilationTest a PR gate (it skips without an SDK) and tests the C# runtime package
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0'

      # Makes TypeScriptCompilationTest a PR gate (it skips without tsc)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            tools/package-lock.json
            packages/npm/bpmn-to-code-runtime/package-lock.json

      - name: Install the pinned TypeScript compiler
        run: |
          npm ci --prefix tools
          echo "$GITHUB_WORKSPACE/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # ProcessPath and the runtime types, over the generated example core keeps equal to the goldens
      - name: Test the C# runtime package
        run: dotnet test packages/nuget/test/Miragon.BpmnToCode.Runtime.Tests

      - name: Test the TypeScript runtime package
        working-directory: packages/npm/bpmn-to-code-runtime
        run: |
          npm ci
          npm test

      # Linting runs in the quality job
      - name: Run Gradle Build
        run: ./gradlew build --warning-mode all -x lintKotlin -x detekt -x detektMain -x detektTest

      # Starts the archive with its bundled runtime and no JDK on the PATH
      - name: Smoke test the CLI archive
        run: |
          ./gradlew :bpmn-to-code-cli:cliArchive
          mkdir -p cli-smoke
          unzip -q bpmn-to-code-cli/build/cli-archive/*.zip -d cli-smoke
          env -u JAVA_HOME PATH=/usr/bin:/bin bpmn-to-code-cli/scripts/smoke-test.sh cli-smoke/bpmn-to-code-*/bin/bpmn-to-code

      # ≥ 75% per class
      - name: Check Coverage
        run: ./gradlew :bpmn-to-code-core:jacocoTestCoverageVerification :bpmn-to-code-web:jacocoTestCoverageVerification :bpmn-to-code-testing:jacocoTestCoverageVerification :bpmn-to-code-runtime:jacocoTestCoverageVerification :bpmn-to-code-cli:jacocoTestCoverageVerification

      - name: Post Coverage Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COVERAGE_TABLE=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os
          modules = [
              "bpmn-to-code-core",
              "bpmn-to-code-gradle",
              "bpmn-to-code-maven",
              "bpmn-to-code-web",
              "bpmn-to-code-testing",
              "bpmn-to-code-runtime",
              "bpmn-to-code-cli",
          ]
          rows = []
          for m in modules:
              path = f"{m}/build/reports/jacoco/test/jacocoTestReport.xml"
              if not os.path.exists(path):
                  rows.append(f"| {m} | n/a |")
                  continue
              root = ET.parse(path).getroot()
              line = next((c for c in root.findall("counter") if c.get("type") == "LINE"), None)
              if line is None:
                  rows.append(f"| {m} | n/a |")
              else:
                  covered = int(line.get("covered", 0))
                  missed = int(line.get("missed", 0))
                  total = covered + missed
                  pct = round(covered * 100 / total, 1) if total > 0 else 0.0
                  rows.append(f"| {m} | {pct}% ({covered}/{total} lines) |")
          print("| Module | Line Coverage |\n|--------|---------------|\n" + "\n".join(rows))
          EOF
          )
          MARKER="<!-- bpmn-to-code-coverage -->"
          BODY="${MARKER}
          **Test Coverage**

          ${COVERAGE_TABLE}"
          # Delete any existing coverage comment before posting a fresh one
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | contains("<!-- bpmn-to-code-coverage -->")) | .id' | \
            xargs -I{} gh api --method DELETE "repos/${{ github.repository }}/issues/comments/{}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
