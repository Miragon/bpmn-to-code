name: Deploy Documentation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, do not deploy to Pages)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry run (build only, do not deploy to Pages)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The full history: VitePress reads "last updated" from git.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Enforce pinned npm dependencies
        uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1
        with:
          root-path: docs

      - name: Install Dependencies
        run: npm ci
        working-directory: docs

      # The kit in docs/.vitepress/miragon/ and the logos in docs/public/logo/ come unchanged
      # from the corporate identity. Fails when someone edited them in this repo.
      - name: Check the Miragon docs kit
        run: node .vitepress/miragon/check.mjs
        working-directory: docs

      - name: Build Site
        run: npm run build
        working-directory: docs
        env:
          # Project pages are served under /bpmn-to-code/; the kit sets VitePress' base from it.
          DOCS_BASE: /bpmn-to-code/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: inputs.dry_run != true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
