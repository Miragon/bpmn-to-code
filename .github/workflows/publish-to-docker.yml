name: Publish to Docker Hub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build & verify only, no real publish)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry run (build & verify only, no real publish)'
        type: boolean
        default: false

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build & Test
        run: ./gradlew build --warning-mode all

      - name: Log in to Docker Hub
        if: inputs.dry_run != true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_MIRAGON_USERNAME }}
          password: ${{ secrets.DOCKER_MIRAGON_PASSWORD }}

      - name: Build Docker Image
        run: ./gradlew :bpmn-to-code-web:dockerBuild

      - name: Push Docker Image
        if: inputs.dry_run != true
        run: ./gradlew :bpmn-to-code-web:dockerPush

      - name: Push Latest Tag
        if: inputs.dry_run != true
        run: docker push miragon/bpmn-to-code-web:latest

      - name: Update Docker Hub Description
        if: inputs.dry_run != true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_MIRAGON_USERNAME }}
          password: ${{ secrets.DOCKER_MIRAGON_PASSWORD }}
          repository: miragon/bpmn-to-code-web
          readme-filepath: ./bpmn-to-code-web/README.md

      - name: Log out from Docker Hub
        if: always() && inputs.dry_run != true
        run: docker logout
