version: 2
updates:

  # Gradle: core, plugins, web, cli, runtime, testing
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    groups:
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm: docs website and bpmnlint tooling
  - package-ecosystem: "npm"
    directories:
      - "/docs"
      - "/tools"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # NuGet: test dependencies of the C# runtime package
  - package-ecosystem: "nuget"
    directory: "/packages/nuget"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base image of the web app
  - package-ecosystem: "docker"
    directory: "/bpmn-to-code-web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-images:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"
