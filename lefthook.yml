pre-push:
  commands:
    compile:
      glob: "*.{kt,kts}"
      run: ./gradlew compileKotlin
    coverage:
      glob: "*.{kt,kts}"
      run: ./gradlew :bpmn-to-code-core:jacocoTestCoverageVerification
    ktlint:
      glob: "*.{kt,kts}"
      run: ./gradlew lintKotlin
    detekt:
      glob: "*.{kt,kts}"
      run: ./gradlew detekt
